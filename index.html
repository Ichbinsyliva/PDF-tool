<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF 转 9:16 竖图</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f4; --panel:#ffffff; --ink:#1b2430; --sub:#5d6b7a; --line:#d5dbe2;
  --accent:#1f5eff; --accent-ink:#ffffff; --ok:#1c8a4f;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --panel:#1a212a; --ink:#e8edf2; --sub:#93a1b0; --line:#2b3542;
    --accent:#5b8cff; --accent-ink:#0b1220; --ok:#4cc38a;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#1a212a; --ink:#e8edf2; --sub:#93a1b0; --line:#2b3542;
  --accent:#5b8cff; --accent-ink:#0b1220; --ok:#4cc38a;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  line-height:1.6}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:8px 0 4px;letter-spacing:.5px}
.lead{color:var(--sub);margin:0 0 18px;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:26px 12px;text-align:center;cursor:pointer;color:var(--sub)}
.drop strong{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
.drop input{display:none}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.field{flex:1 1 200px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
select,input[type=color]{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;padding:0 8px}
input[type=color]{padding:3px}
input[type=text]{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;padding:0 12px}
button{font:inherit;cursor:pointer}
.btn{height:46px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 18px;width:100%;margin-top:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px}
.btn:disabled{opacity:.5;cursor:default}
.status{font-size:14px;color:var(--sub);margin-top:12px;min-height:22px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px;display:none}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.tip{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px;display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.card img{display:block;width:100%;aspect-ratio:9/16;object-fit:contain;border-radius:6px;background:#888}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-top:6px}
.card a{color:var(--accent);text-decoration:none;font-size:13px}
</style>
</head>
<body>
<main>
  <h1>PDF 转 9:16 竖图</h1>
  <p class="lead">选一个 PDF，每一页自动生成一张 9:16（1080×1920）图片。文件只在你的浏览器里处理，不会上传。</p>

  <div class="tip" id="inapp" style="border-left-color:#d98a00">你現在可能在某個 App 的內置瀏覽器裏。選文件、保存圖片容易出問題，建議點右上角「⋯」，選「用瀏覽器打開」，改用 Chrome（Android）或 Safari（iPhone）。</div>

  <div class="panel">
    <label class="drop" id="drop">
      <strong id="dropTitle">点这里选择 PDF 文件</strong>
      <span id="dropSub">也可以把文件拖进来</span>
      <input type="file" id="file" accept="application/pdf,.pdf">
    </label>

    <div class="row">
      <div class="field">
        <label for="mode">排版方式</label>
        <select id="mode">
          <option value="fit">整页缩放放进画面（四周留白）</option>
          <option value="width">按宽度铺满，长页自动切成多张</option>
          <option value="fill">铺满画面（多余部分裁掉）</option>
        </select>
      </div>
      <div class="field">
        <label for="bg">留白背景色</label>
        <input type="color" id="bg" value="#ffffff">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="fmt">图片格式</label>
        <select id="fmt">
          <option value="jpeg">JPEG（体积小）</option>
          <option value="png">PNG（最清晰）</option>
        </select>
      </div>
      <div class="field">
        <label for="size">尺寸</label>
        <select id="size">
          <option value="1080">1080 × 1920</option>
          <option value="720">720 × 1280</option>
          <option value="1440">1440 × 2560</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="wmText">水印文字（留空則不加水印）</label>
        <input type="text" id="wmText" value="@sawol._.852" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="wmOp">水印濃淡</label>
        <select id="wmOp">
          <option value="0.10">很淺</option>
          <option value="0.16" selected>淺</option>
          <option value="0.24">稍明顯</option>
        </select>
      </div>
    </div>

    <button class="btn" id="go" disabled>开始转换</button>
    <div class="bar" id="bar"><i id="barI"></i></div>
    <div class="status" id="status"></div>
  </div>

  <div class="tip" id="tip">转换完成。点「一键保存全部到相册」，在弹出的菜单里选「存储图像」或「保存到相册」即可一次存完。如果没有这个菜单，可以用「ZIP」或「逐张下载」，也可以长按单张图片保存。</div>

  <div id="actions" style="display:none">
    <button class="btn" id="shareAll">一键保存全部到相册（分享菜单）</button>
    <button class="btn ghost" id="zipAll">打包成 ZIP 下载</button>
    <button class="btn ghost" id="dlAll">逐张下载全部</button>
  </div>
  <div class="grid" id="grid" style="margin-top:14px"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var fileInput=$('file'), go=$('go'), statusEl=$('status'), grid=$('grid'),
      bar=$('bar'), barI=$('barI'), tip=$('tip'), shareAll=$('shareAll'), actions=$('actions'), drop=$('drop');
  (function(){
    var ua=navigator.userAgent||'';
    if(/MicroMessenger|QQ\/|MQQBrowser|Weibo|FBAN|FBAV|Instagram|Line\/|xhs|XiaoHongShu|Douyin|aweme|Doubao|DingTalk|; wv\)/i.test(ua)){
      $('inapp').style.display='block';
    }
  })();
  var pdfFile=null, pdfBuf=null, results=[]; // {blob,name,url}

  try{ pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}

  function setFile(f){
    if(!f) return;
    if(f.type!=='application/pdf' && !/\.pdf$/i.test(f.name)){
      statusEl.textContent='这不是 PDF 文件，请重新选择。'; return;
    }
    pdfFile=f;
    $('dropTitle').textContent=f.name;
    $('dropSub').textContent=(f.size/1024/1024).toFixed(2)+' MB，点击可更换';
    pdfBuf=null; go.disabled=true; statusEl.textContent='正在讀取文件…';
    f.arrayBuffer().then(function(b){
      pdfBuf=b; go.disabled=false; statusEl.textContent='';
    }).catch(function(e){
      pdfBuf=null; go.disabled=true;
      statusEl.textContent='無法讀取這個文件。請先把 PDF 保存到手機本地（不要直接從雲端硬碟或聊天 App 裏選），再用 Chrome 打開本頁重新選擇。';
    });
  }
  fileInput.addEventListener('change',function(){setFile(fileInput.files[0])});
  ['dragover','dragenter'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault()})});
  drop.addEventListener('drop',function(e){e.preventDefault(); setFile(e.dataTransfer.files[0])});

  function canvasToBlob(c,type,q){
    return new Promise(function(res){ c.toBlob(function(b){res(b)},type,q); });
  }

  async function run(){
    if(!pdfFile || !pdfBuf) return;
    go.disabled=true; grid.innerHTML=''; results.forEach(function(r){URL.revokeObjectURL(r.url)}); results=[];
    tip.style.display='none'; actions.style.display='none';
    bar.style.display='block'; barI.style.width='0';
    var W=parseInt($('size').value,10), H=Math.round(W*16/9);
    var mode=$('mode').value, bg=$('bg').value, fmt=$('fmt').value;
    var mime=fmt==='png'?'image/png':'image/jpeg', ext=fmt==='png'?'png':'jpg';
    var base=pdfFile.name.replace(/\.pdf$/i,'');
    var wm=$('wmText').value.trim(), wmA=parseFloat($('wmOp').value)||0.16;
    try{
      statusEl.textContent='正在读取 PDF…';
      var buf=new Uint8Array(pdfBuf.slice(0));
      var pdf=await pdfjsLib.getDocument({data:buf}).promise;
      var n=pdf.numPages, made=0;
      for(var p=1;p<=n;p++){
        statusEl.textContent='正在处理第 '+p+' / '+n+' 页…';
        var page=await pdf.getPage(p);
        var v1=page.getViewport({scale:1});
        // 渲染缩放：让页面的渲染宽度足够清晰
        var targetW = (mode==='width') ? W : Math.min(W, H*v1.width/v1.height);
        var scale = (mode==='fill') ? Math.max(W/v1.width, H/v1.height) : (mode==='width' ? W/v1.width : Math.min(W/v1.width, H/v1.height));
        var vp=page.getViewport({scale:scale});
        var pc=document.createElement('canvas');
        pc.width=Math.ceil(vp.width); pc.height=Math.ceil(vp.height);
        var pctx=pc.getContext('2d');
        pctx.fillStyle='#ffffff'; pctx.fillRect(0,0,pc.width,pc.height);
        await page.render({canvasContext:pctx,viewport:vp}).promise;

        var slices=[];
        if(mode==='width'){
          var total=pc.height, y=0;
          if(total<=H){ slices.push({sy:0,sh:total}); }
          else { while(y<total){ slices.push({sy:y,sh:Math.min(H,total-y)}); y+=H; } }
        }else{
          slices.push({sy:0,sh:pc.height});
        }
        for(var s=0;s<slices.length;s++){
          var out=document.createElement('canvas'); out.width=W; out.height=H;
          var o=out.getContext('2d');
          o.fillStyle=(mode==='fit'||mode==='width')?bg:'#ffffff'; o.fillRect(0,0,W,H);
          var sl=slices[s];
          if(mode==='fit'){
            o.drawImage(pc,0,0,pc.width,pc.height,(W-pc.width)/2,(H-pc.height)/2,pc.width,pc.height);
          }else if(mode==='fill'){
            var sx=Math.max(0,(pc.width-W)/2), sy2=Math.max(0,(pc.height-H)/2);
            o.drawImage(pc,sx,sy2,Math.min(W,pc.width),Math.min(H,pc.height),0,0,Math.min(W,pc.width),Math.min(H,pc.height));
          }else{
            o.drawImage(pc,0,sl.sy,pc.width,sl.sh,0,0,pc.width,sl.sh);
          }
          drawWM(o,W,H,wm,wmA);
          var blob=await canvasToBlob(out,mime,0.93);
          made++;
          var name=base+'_'+String(made).padStart(3,'0')+'.'+ext;
          var url=URL.createObjectURL(blob);
          results.push({blob:blob,name:name,url:url});
          addCard(url,name,made,p,blob);
          out.width=out.height=0;
        }
        pc.width=pc.height=0;
        barI.style.width=(p/n*100)+'%';
        page.cleanup();
      }
      statusEl.textContent='完成：'+n+' 页，共生成 '+made+' 张图片。';
      tip.style.display='block';
      actions.style.display='block';
    }catch(err){
      console.error(err);
      statusEl.textContent='转换失败：'+(err&&err.message?err.message:err)+'。请确认 PDF 没有加密，或换一个文件再试。';
    }finally{
      go.disabled=false;
    }
  }

  function drawWM(ctx,W,H,text,alpha){
    if(!text) return;
    var fs=Math.round(W*0.03);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle='#808080';
    ctx.font='500 '+fs+'px -apple-system,"PingFang SC","Noto Sans SC",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.translate(W/2,H/2); ctx.rotate(-Math.PI/6);
    var tw=ctx.measureText(text).width, stepX=tw+fs*4, stepY=fs*5.5;
    var R=Math.sqrt(W*W+H*H)/2, row=0;
    for(var y=-R;y<=R;y+=stepY,row++){
      var off=(row%2)*stepX/2;
      for(var x=-R-stepX+off;x<=R+stepX;x+=stepX) ctx.fillText(text,x,y);
    }
    ctx.restore();
  }

  function addCard(url,name,idx,page,blob){
    var c=document.createElement('div'); c.className='card';
    var img=document.createElement('img'); img.alt=name;
    try{
      var fr=new FileReader();
      fr.onload=function(){ img.src=fr.result; };
      fr.readAsDataURL(blob);
    }catch(e){ img.src=url; }
    var m=document.createElement('div'); m.className='meta';
    var t=document.createElement('span'); t.textContent='第 '+idx+' 张（PDF 第 '+page+' 页）';
    var a=document.createElement('a'); a.href=url; a.download=name; a.textContent='下载';
    m.appendChild(t); m.appendChild(a);
    c.appendChild(img); c.appendChild(m); grid.appendChild(c);
  }

  shareAll.addEventListener('click',async function(){
    try{
      var files=results.map(function(r){return new File([r.blob],r.name,{type:r.blob.type})});
      if(navigator.canShare && navigator.canShare({files:files})){
        await navigator.share({files:files});
      }else{
        statusEl.textContent='当前浏览器不支持批量分享，请长按每张图片保存。';
      }
    }catch(e){
      if(e && e.name!=='AbortError') statusEl.textContent='分享没有成功，请长按图片保存。';
    }
  });

  // ---- ZIP（不压缩，仅打包）----
  var crcTable=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
  function crc32(u8){var c=0xFFFFFFFF;for(var i=0;i<u8.length;i++)c=crcTable[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
  async function makeZip(files){
    var enc=new TextEncoder(), parts=[], central=[], offset=0;
    var d=new Date(), dosTime=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),
        dosDate=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
    for(var i=0;i<files.length;i++){
      var data=new Uint8Array(await files[i].blob.arrayBuffer());
      var nb=enc.encode(files[i].name), crc=crc32(data);
      var lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
      lh.setUint16(10,dosTime,true);lh.setUint16(12,dosDate,true);lh.setUint32(14,crc,true);
      lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
      parts.push(lh.buffer,nb,data);
      var ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
      ch.setUint16(12,dosTime,true);ch.setUint16(14,dosDate,true);ch.setUint32(16,crc,true);
      ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nb.length,true);
      ch.setUint32(42,offset,true);
      central.push(ch.buffer,nb);
      offset+=30+nb.length+data.length;
    }
    var csize=0;central.forEach(function(x){csize+=x.byteLength});
    var end=new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
    end.setUint32(12,csize,true);end.setUint32(16,offset,true);
    return new Blob(parts.concat(central,[end.buffer]),{type:'application/zip'});
  }
  function saveBlob(blob,name){
    var u=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},8000);
  }
  $('zipAll').addEventListener('click',async function(){
    try{
      statusEl.textContent='正在打包 ZIP…';
      var z=await makeZip(results);
      saveBlob(z,(pdfFile?pdfFile.name.replace(/\.pdf$/i,''):'pages')+'_9x16.zip');
      statusEl.textContent='ZIP 已生成。在手机「文件」App 里解压后，可以全选图片存到相册。';
    }catch(e){statusEl.textContent='打包失败，请改用「逐张下载」。'}
  });
  $('dlAll').addEventListener('click',async function(){
    for(var i=0;i<results.length;i++){
      saveBlob(results[i].blob,results[i].name);
      statusEl.textContent='正在下载 '+(i+1)+' / '+results.length+'…';
      await new Promise(function(r){setTimeout(r,500)});
    }
    statusEl.textContent='已触发全部下载。如果浏览器拦截了，请在弹出的提示里选「允许」。';
  });

  go.addEventListener('click',run);
})();
</script>
</body>
</html>
